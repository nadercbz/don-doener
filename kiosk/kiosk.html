:root{--blue:#0B369A;--terra:#C34811;--linen:#D9D1CA;--ink:#0A1B45;--paper:#FBFAF7;--ice:#B7CFF7;--sun:#F4C430;--u:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#050d22;overflow:hidden;font-family:'DM Sans',sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--paper)}
#app{position:absolute;inset:0}
.tiles{background-color:var(--blue);background-image:linear-gradient(rgba(255,255,255,.12) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.12) 2px,transparent 2px);background-size:84px 84px}
.logo{display:block}
/* Kopfleiste */
.top{position:absolute;left:0;right:0;top:0;height:150px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;color:var(--paper);z-index:5}
.top .logo{width:290px;height:125px}
.pills{display:flex;gap:14px}
.pill{height:68px;padding:0 28px;border-radius:999px;background:rgba(255,255,255,.16);color:var(--paper);font-size:26px;font-weight:700;display:flex;align-items:center;gap:10px;white-space:nowrap}
.pill.on{background:var(--paper);color:var(--blue)}
.pill b{background:var(--terra);color:var(--paper);border-radius:999px;min-width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;font-size:20px}
/* Start */
.attract{position:absolute;inset:0;color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:110px 60px 90px;text-align:center}
.attract video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.attract>*{position:relative;z-index:1}
.attract .logo{width:760px;height:326px}
.attract h1{margin:0;font-size:92px;line-height:1.02;font-weight:700;text-transform:uppercase;letter-spacing:-.01em}
.attract .sub{font-size:34px;color:var(--ice);font-weight:500;margin-top:18px}
.hero{height:620px;width:100%;position:relative}
.hero img{position:absolute;left:50%;top:50%;width:640px;height:600px;object-fit:contain;transform:translate(-50%,-50%);opacity:0;animation:fade 16s infinite}
.hero img:nth-child(2){animation-delay:4s}.hero img:nth-child(3){animation-delay:8s}.hero img:nth-child(4){animation-delay:12s}
@keyframes fade{0%{opacity:0;transform:translate(-50%,-48%) scale(.96)}6%,22%{opacity:1;transform:translate(-50%,-50%) scale(1)}28%,100%{opacity:0;transform:translate(-50%,-52%) scale(1.02)}}
.cta{height:150px;padding:0 90px;border-radius:999px;background:var(--paper);color:var(--blue);font-size:48px;font-weight:700;display:inline-flex;align-items:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.foot{position:absolute;left:40px;right:40px;bottom:22px;font-size:19px;line-height:1.35;color:rgba(183,207,247,.9);text-align:center;z-index:2}
.light .foot,.foot.dk{color:#4a5578}
/* Wahl Hier oder Mitnehmen */
.mode{position:absolute;left:0;right:0;top:150px;bottom:0;padding:90px 70px;display:flex;flex-direction:column;gap:50px}
.mode h2,.h2{margin:0;font-size:68px;font-weight:700;color:var(--blue);line-height:1.05}
.mode p{margin:-30px 0 0;font-size:30px;color:#2d3a62}
.bigbtn{flex:1;border-radius:60px;background:var(--linen);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;font-size:64px;font-weight:700;color:var(--blue)}
.bigbtn small{font-size:30px;font-weight:500;color:#2d3a62}
.bigbtn.b{background:var(--blue);color:var(--paper)}.bigbtn.b small{color:var(--ice)}
/* Menue */
.menu{position:absolute;left:0;right:0;top:150px;bottom:190px;display:flex}
.rail{width:230px;padding:30px 0 30px 30px;display:flex;flex-direction:column;gap:12px;overflow:auto;background:var(--paper)}
.rail button{height:96px;border-radius:30px 0 0 30px;background:var(--linen);font-size:30px;font-weight:700;color:var(--blue);text-align:left;padding:0 22px;display:flex;align-items:center}
.rail button.on{background:var(--blue);color:var(--paper)}
.grid{flex:1;overflow:auto;padding:24px 34px 40px 20px;display:grid;grid-template-columns:1fr 1fr;gap:22px;align-content:start}
.grid .head{grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between;gap:20px}
.grid .head h2{margin:0;font-size:54px;color:var(--blue);font-weight:700}
.grid .head span{font-size:24px;color:#4a5578}
.card{background:#fff;border-radius:40px;padding:18px 20px 22px;display:flex;flex-direction:column;position:relative;box-shadow:0 0 0 2px rgba(10,27,69,.06)}
.card.sold{opacity:.45;pointer-events:none}
.card .im{height:220px;border-radius:30px;background:var(--linen);position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.card .im img{max-width:88%;max-height:116%;object-fit:contain;transform:translateY(-6px)}
.card h3{margin:0;font-size:34px;line-height:1.1;font-weight:700}
.card p{margin:6px 0 0;font-size:21px;line-height:1.3;color:#2d3a62;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:82px}
.card .al{font-size:19px;color:#5d6788;letter-spacing:.1em;margin-top:8px;font-weight:500;min-height:24px}
.card .bt{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.price{font-size:38px;font-weight:700;color:var(--terra)}
.add{width:84px;height:84px;border-radius:50%;background:var(--blue);color:var(--paper);font-size:56px;font-weight:500;display:flex;align-items:center;justify-content:center;line-height:1}
.tag{display:inline-block;font-size:17px;font-weight:700;letter-spacing:.06em;padding:2px 11px;border-radius:999px;background:var(--blue);color:var(--paper);vertical-align:middle;margin-left:10px}
.warn{position:absolute;left:14px;top:14px;background:var(--terra);color:var(--paper);font-size:19px;font-weight:700;border-radius:999px;padding:6px 14px;z-index:2;max-width:78%}
.hot{display:inline-block;margin-left:10px;white-space:nowrap;vertical-align:middle}.hot i{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--terra);margin-right:5px}.hot i.o{background:none;box-shadow:inset 0 0 0 2px var(--terra)}
.mimgs{display:flex;gap:0;height:100%;width:100%;align-items:center;justify-content:center}.mimgs img{max-height:94%;max-width:34%;margin:0 -4px}
.soldtag{position:absolute;right:20px;top:20px;background:var(--ink);color:var(--paper);font-size:20px;font-weight:700;border-radius:999px;padding:6px 16px;z-index:2}
/* Warenkorbleiste */
.bar{position:absolute;left:0;right:0;bottom:0;height:190px;background:var(--blue);color:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:0 50px;z-index:4}
.bar .t{font-size:30px;font-weight:500;color:var(--ice)}.bar .s{font-size:60px;font-weight:700;line-height:1.05}
.go{height:120px;padding:0 60px;border-radius:999px;background:var(--paper);color:var(--blue);font-size:40px;font-weight:700;display:flex;align-items:center}
.go[disabled]{opacity:.4}
/* Sheet */
.scrim{position:absolute;inset:0;background:rgba(10,27,69,.6);z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:1620px;height:1620px;background:var(--paper);border-radius:70px 70px 0 0;z-index:21;display:flex;flex-direction:column;animation:up .28s ease-out}
@keyframes up{from{transform:translateY(80px);opacity:.3}}
.sheet .x{position:absolute;right:34px;top:30px;width:84px;height:84px;border-radius:50%;background:var(--linen);font-size:44px;color:var(--blue);z-index:3}
.sheet .body{flex:1;overflow:auto;padding:0 56px 30px}
.sheet .pic{height:340px;margin:0 -56px 10px;background:var(--linen);border-radius:70px 70px 0 0;display:flex;align-items:center;justify-content:center}
.sheet .pic img{max-height:116%;max-width:70%;object-fit:contain;transform:translateY(8px)}
.sheet h2{margin:20px 0 6px;font-size:58px;line-height:1.05;color:var(--blue)}
.sheet .d{font-size:27px;line-height:1.35;color:#2d3a62;margin:0 0 10px}
.sheet .a{font-size:22px;color:#5d6788;margin:0 0 6px}
.grp{margin-top:28px}
.grp h4{margin:0 0 14px;font-size:32px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.grp h4 span{font-size:24px;font-weight:500;color:#4a5578}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.opt{border-radius:36px;background:var(--linen);padding:22px 26px;font-size:32px;font-weight:700;color:var(--blue);text-align:left;min-height:120px;display:flex;flex-direction:column;justify-content:center}
.opt small{font-size:23px;font-weight:500;color:#2d3a62;margin-top:4px}
.opt.on{background:var(--blue);color:var(--paper);box-shadow:inset 0 0 0 4px var(--ice)}.opt.on small{color:var(--ice)}
.chips{display:flex;flex-wrap:wrap;gap:14px}
.chip{border-radius:999px;background:var(--linen);padding:0 30px;height:84px;font-size:28px;font-weight:700;color:var(--blue);display:flex;align-items:center;gap:14px}
.chip.off{background:var(--paper);box-shadow:inset 0 0 0 3px var(--terra);color:var(--terra);text-decoration:line-through}
.sauce{display:flex;align-items:center;justify-content:space-between;border-radius:36px;background:var(--linen);padding:12px 18px 12px 26px;min-height:104px}
.sauce b{font-size:30px;color:var(--blue)}.sauce small{display:block;font-size:20px;color:#2d3a62;font-weight:500}
.step{display:flex;align-items:center;gap:14px}.step button{width:70px;height:70px;border-radius:50%;background:var(--blue);color:var(--paper);font-size:44px;line-height:1;display:flex;align-items:center;justify-content:center}.step button[disabled]{opacity:.28}.step span{font-size:34px;font-weight:700;min-width:30px;text-align:center}
.sheet .foot2{padding:20px 56px 36px;border-top:2px solid var(--linen);display:flex;align-items:center;justify-content:space-between;gap:24px;background:var(--paper)}
.add2{flex:1;height:130px;border-radius:999px;background:var(--blue);color:var(--paper);font-size:42px;font-weight:700;display:flex;align-items:center;justify-content:space-between;padding:0 54px}
.add2[disabled]{background:var(--linen);color:#6b7595}
.hint{font-size:24px;color:var(--terra);font-weight:700}
/* Upsell / Warenkorb / Zahlung */
.page{position:absolute;left:0;right:0;top:150px;bottom:190px;overflow:auto;padding:50px 60px}
.page .h2{margin-bottom:12px}.page .lead{font-size:30px;color:#2d3a62;margin:0 0 34px}
.ups{display:flex;flex-direction:column;gap:20px}
.urow{display:flex;align-items:center;gap:22px;background:#fff;border-radius:40px;padding:18px 24px;box-shadow:0 0 0 2px rgba(10,27,69,.06)}
.urow .im{width:200px;height:160px;border-radius:30px;background:var(--linen);display:flex;align-items:center;justify-content:center;flex:none}.urow .im img{max-width:90%;max-height:110%;object-fit:contain}
.urow .tx{flex:1}.urow .tx b{font-size:36px;display:block;line-height:1.1}.urow .tx span{font-size:22px;color:#2d3a62}
.crow{display:flex;align-items:center;gap:20px;background:#fff;border-radius:36px;padding:16px 24px;margin-bottom:16px;box-shadow:0 0 0 2px rgba(10,27,69,.06)}
.crow .im{width:140px;height:120px;border-radius:26px;background:var(--linen);display:flex;align-items:center;justify-content:center;flex:none}.crow .im img{max-width:90%;max-height:110%;object-fit:contain}
.crow .tx{flex:1;min-width:0}.crow .tx b{font-size:32px;line-height:1.1;display:block}.crow .tx span{font-size:21px;color:#2d3a62;display:block;line-height:1.3;margin-top:2px}
.crow .pr{font-size:32px;font-weight:700;color:var(--terra);min-width:130px;text-align:right}
.crow .rm{font-size:21px;color:var(--terra);font-weight:700;text-decoration:underline;margin-top:6px;display:block}
.sum{background:var(--linen);border-radius:40px;padding:28px 36px;margin-top:20px;font-size:28px}
.sum div{display:flex;justify-content:space-between;padding:4px 0}.sum .tot{font-size:48px;font-weight:700;color:var(--blue);border-top:2px solid rgba(10,27,69,.2);margin-top:10px;padding-top:14px}
.sum small{font-size:21px;color:#4a5578}
.skip{height:100px;padding:0 50px;border-radius:999px;background:rgba(255,255,255,.16);color:var(--paper);font-size:32px;font-weight:700}
.payopts{display:flex;flex-direction:column;gap:30px;margin-top:20px}
.payopts .bigbtn{min-height:380px;flex:none}
.center{position:absolute;inset:150px 0 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;text-align:center;padding:60px}
.center h2{margin:0;font-size:72px;color:var(--blue)}.center p{margin:0;font-size:32px;color:#2d3a62;max-width:800px;line-height:1.35}
.ring{width:240px;height:240px;border-radius:50%;border:16px solid var(--linen);border-top-color:var(--blue);animation:spin 1.1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.demo{position:absolute;left:60px;right:60px;bottom:210px;font-size:24px;color:#4a5578;display:flex;align-items:center;gap:16px}
.demo input{width:34px;height:34px}
.done{position:absolute;inset:0;color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;text-align:center;padding:60px}
.done .logo{width:520px;height:223px}.done .n{font-size:300px;font-weight:700;line-height:.95;letter-spacing:-.02em}
.done h2{margin:0;font-size:60px}.done p{margin:0;font-size:32px;color:var(--ice);max-width:820px;line-height:1.35}
.bon{background:var(--paper);color:var(--ink);border-radius:30px;padding:26px 34px;width:640px;font-size:21px;line-height:1.45;text-align:left;font-family:'DM Sans',monospace}
.bon div{display:flex;justify-content:space-between}.bon hr{border:0;border-top:2px dashed #b8b2ab;margin:8px 0}
/* Dialoge */
.dlg{position:absolute;left:70px;right:70px;top:300px;background:var(--paper);border-radius:60px;padding:50px;z-index:30;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.dlg h3{margin:0 0 10px;font-size:52px;color:var(--blue)}.dlg p{margin:0 0 26px;font-size:28px;color:#2d3a62}
.acb{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:30px}.acb button{height:86px;padding:0 28px;border-radius:999px;background:var(--linen);font-size:28px;font-weight:700;color:var(--blue)}.acb button.on{background:var(--terra);color:var(--paper)}
.row2{display:flex;gap:18px}.row2 button{flex:1;height:110px;border-radius:999px;font-size:36px;font-weight:700;background:var(--blue);color:var(--paper)}.row2 button.g{background:var(--linen);color:var(--blue)}
.toast{position:absolute;left:80px;right:80px;bottom:230px;background:var(--ink);color:var(--paper);border-radius:40px;padding:26px 34px;font-size:28px;z-index:40;text-align:center}
.cdn{font-size:150px;font-weight:700;color:var(--terra);line-height:1;margin:6px 0 24px;text-align:center}
/* Barrierefrei: Inhalt in der unteren Haelfte, groessere Schrift */
.access #app{top:760px;bottom:0;height:1160px}
.access .top{height:130px}.access .menu,.access .page,.access .mode{top:130px}
.access .rail{width:200px}.access .rail button{font-size:34px;height:110px}
.access .grid{grid-template-columns:1fr}.access .card h3{font-size:42px}.access .card p{font-size:27px;min-height:0}.access .price{font-size:46px}
.access .sheet{height:1120px;max-height:1120px}.access .sheet .pic{height:220px}
.access .attract{padding-top:60px}
.accband{display:none}.access .accband{display:flex;position:absolute;left:0;right:0;top:0;height:760px;background:var(--blue);color:var(--paper);align-items:center;justify-content:center;flex-direction:column;gap:20px;font-size:54px;font-weight:700;text-align:center;z-index:50;padding:60px}.accband small{font-size:30px;font-weight:500;color:var(--ice)}
/* Kueche und Abholung */
.k-wrap{position:absolute;inset:0;background:var(--ink);color:var(--paper);display:flex;flex-direction:column}
.k-top{height:110px;display:flex;align-items:center;justify-content:space-between;padding:0 50px;background:var(--blue)}
.k-top .logo{width:230px;height:99px}.k-top h1{margin:0;font-size:46px;text-transform:uppercase;letter-spacing:.04em}
.k-cols{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding:20px 24px 24px;min-height:0}
.k-col{background:rgba(255,255,255,.07);border-radius:36px;padding:18px;display:flex;flex-direction:column;gap:14px;min-height:0;overflow:hidden}
.k-col h2{margin:0 4px 4px;font-size:30px;text-transform:uppercase;letter-spacing:.08em;color:var(--ice);display:flex;justify-content:space-between}
.tk{background:var(--paper);color:var(--ink);border-radius:28px;padding:16px 20px;flex:none}
.tk.late{box-shadow:0 0 0 6px var(--terra)}
.tk .h{display:flex;justify-content:space-between;align-items:baseline}.tk .h b{font-size:46px;color:var(--blue)}.tk .h span{font-size:22px;color:#4a5578;font-weight:700}
.tk .m{font-size:20px;color:#4a5578;margin-bottom:6px;font-weight:500}
.tk .l{font-size:23px;line-height:1.3;border-top:2px solid var(--linen);padding:6px 0}.tk .l b{color:var(--blue)}.tk .l i{font-style:normal;display:block;font-size:19px;color:#2d3a62}
.tk .l em{font-style:normal;background:var(--blue);color:var(--paper);border-radius:999px;font-size:15px;font-weight:700;padding:1px 9px;margin-left:8px;vertical-align:middle}
.tk .ox{color:var(--terra);font-weight:700}
.tk button{width:100%;height:64px;border-radius:999px;background:var(--blue);color:var(--paper);font-size:26px;font-weight:700;margin-top:10px}
.k-btn{height:64px;padding:0 28px;border-radius:999px;background:rgba(255,255,255,.18);color:var(--paper);font-size:26px;font-weight:700}
.k-draw{position:absolute;right:24px;top:120px;bottom:24px;width:760px;background:var(--paper);color:var(--ink);border-radius:40px;padding:30px;overflow:auto;z-index:5;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.k-draw h3{margin:0 0 14px;font-size:38px;color:var(--blue)}
.k-draw .it{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:2px solid var(--linen);font-size:24px}.k-draw .it button{height:52px;padding:0 20px;border-radius:999px;background:var(--linen);color:var(--blue);font-size:20px;font-weight:700}.k-draw .it button.on{background:var(--terra);color:var(--paper)}
.r-wrap{position:absolute;inset:0;display:grid;grid-template-columns:1.6fr 1fr;color:var(--paper)}
.r-wrap section{padding:60px 70px}.r-wrap h1{margin:0 0 40px;font-size:68px;text-transform:uppercase;letter-spacing:.04em}
.r-a{background:var(--blue)}.r-b{background:var(--ink)}
.nums{display:flex;flex-wrap:wrap;gap:30px}
.nums span{font-size:150px;font-weight:700;line-height:1;background:var(--paper);color:var(--blue);border-radius:50px;padding:28px 50px;animation:pulse 2.4s ease-in-out infinite}
.r-b .nums span{font-size:92px;background:rgba(183,207,247,.16);color:var(--ice);animation:none;padding:18px 36px;border-radius:36px}
.r-top{position:absolute;right:50px;bottom:34px;display:flex;align-items:center;gap:20px;font-size:22px;color:var(--ice)}.r-top .logo{width:200px;height:86px}
.empty{font-size:34px;color:var(--ice);opacity:.8}
.attract.vid>svg,.attract.vid>div:not(.foot){visibility:hidden}
.mimgs{overflow:hidden;padding:0 8px}
.card .im .mimgs img,.sheet .pic .mimgs img,.urow .im .mimgs img,.crow .im .mimgs img{max-width:34%;max-height:92%;transform:none;margin:0 -2px}
.sheet .pic .mimgs img{max-height:80%}
.urow .tx .tag,.crow .tx .tag,.sauce .tag{color:var(--paper);font-size:17px}
.urow .im{width:260px}
</style>
</head>

<script>
/* DON DÖNER Bestellterminal. Bestelllogik, Oberfläche, Küchenmonitor, Abholmonitor. Regeln stehen in Bestelllogik.md.
   Daten kommen aus window.MENU (build_kiosk.py aus Speisekarte.json). Demo: Bestellungen laufen über localStorage und BroadcastChannel zwischen Tabs.
   Im Betrieb ersetzt eine API genau die Funktionen im Block API. Bezahlung ist nur simuliert. */
(function(){
"use strict";
var M = window.MENU, R = M.rules, I = {}; M.items.forEach(function(i){ I[i.id] = i; });
var Q = new URLSearchParams(location.search), VIEW = Q.get("view") || "kiosk";
var W = VIEW === "kiosk" ? 1080 : 1920, H = VIEW === "kiosk" ? 1920 : 1080;
var stage = document.getElementById("stage"), app = document.getElementById("app");
stage.style.width = W + "px"; stage.style.height = H + "px";
function fit(){ if(Q.get("export") === "1"){ stage.style.transform = "none"; return; } var s = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = "scale(" + s + ")"; stage.style.left = ((innerWidth - W * s) / 2) + "px"; stage.style.top = ((innerHeight - H * s) / 2) + "px"; }
addEventListener("resize", fit); fit();
if(VIEW === "kiosk") stage.insertAdjacentHTML("afterbegin", '<div class="accband"><div>Barrierefreier Modus</div><small>Alles liegt jetzt in der unteren Bildschirmhälfte, gut erreichbar im Sitzen. Schrift ist größer.</small></div>');

var SAUCES = M.items.filter(function(i){ return i.kat === "Soßen"; });
var BROT_TXT = {tasche: "Dönertasche", dueruem: "Dürüm"};
function eur(c){ return (c / 100).toFixed(2).replace(".", ",") + " €"; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]; }); }
function img(f, cls){ return '<img src="assets/img/' + f + '" alt=""' + (cls ? ' class="' + cls + '"' : "") + ">"; }
function logo(id, cls){ return '<svg class="logo ' + (cls || "") + '" viewBox="0 0 4181 1796"><use href="#' + id + '"/></svg>'; }
function cname(c){ return M.codes[c]; }

/* ---------------- Zustand ---------------- */
var S = {screen: "attract", mode: null, cat: "Menüs", cart: [], sheet: null, access: false, filter: [], dlg: null, last: null, toast: null, payfail: false, upDone: false, countdown: 15, pm: null};
var uidN = 1, lastTouch = Date.now(), doneTimer = null;

/* ---------------- Preise und Regeln ---------------- */
function sauceCount(l){ return Object.keys(l.sosse).reduce(function(a, k){ return a + l.sosse[k]; }, 0); }
function extraSauces(l){ var it = I[l.id]; return it.sosseIncl ? Math.max(0, sauceCount(l) - it.sosseIncl) : 0; }
function lineUnit(l){ var it = I[l.id], p = it.price; if(it.brot && l.brot === "dueruem") p += R.dueruem_aufpreis; return p + extraSauces(l) * R.sosse_extra; }
function lineTotal(l){ return lineUnit(l) * l.qty; }
function cartTotal(){ return S.cart.reduce(function(a, l){ return a + lineTotal(l); }, 0); }
function cartCount(){ return S.cart.reduce(function(a, l){ return a + l.qty; }, 0); }
function lineComplete(l){ var it = I[l.id]; return !it.sosseIncl || sauceCount(l) >= it.sosseIncl; }
function needMore(l){ var it = I[l.id]; return it.sosseIncl ? Math.max(0, it.sosseIncl - sauceCount(l)) : 0; }
function needsSheet(it){ return !!(it.menu || it.brot || it.sosseIncl || it.ohne.length || it.protein); }
function newLine(it){ return {id: it.id, qty: 1, brot: "tasche", sosse: {}, ohne: [], protein: "Kalb und Rind"}; }
function sameCfg(a, b){ return JSON.stringify([a.id, a.brot, a.sosse, a.ohne, a.protein]) === JSON.stringify([b.id, b.brot, b.sosse, b.ohne, b.protein]); }
function addLine(l){
  for(var i = 0; i < S.cart.length; i++) if(sameCfg(S.cart[i], l)){ S.cart[i].qty = Math.min(R.max_qty, S.cart[i].qty + l.qty); return S.cart[i]; }
  if(S.cart.length >= R.max_lines){ toast("Bitte kurz zum Tresen kommen, das ist eine große Bestellung."); return null; }
  l.uid = uidN++; S.cart.push(l); return l;
}
/* MwSt. Aufteilung (Annahme, mit Steuerberater prüfen): Getränke 19 %, Speisen 7 %, Menüs nach Einzelpreisen der Bestandteile */
function vatSplit(l){
  var it = I[l.id], g = lineUnit(l) * l.qty, o = {g7: 0, g19: 0};
  if(it.menu){ var m = it.menu, a = I[m.main].price, b = I[m.pommes].price, d = I[m.drink].price, sum = a + b + d; o.g19 = g * d / sum; o.g7 = g - o.g19; }
  else if(it.kat === "Getränke") o.g19 = g; else o.g7 = g;
  return o;
}
function totals(){
  var g7 = 0, g19 = 0; S.cart.forEach(function(l){ var v = vatSplit(l); g7 += v.g7; g19 += v.g19; });
  var gross = Math.round(g7 + g19), v7 = Math.round(g7 * 7 / 107), v19 = Math.round(g19 * 19 / 119);
  return {gross: gross, vat7: v7, vat19: v19, net: gross - v7 - v19};
}
function containsOf(it, filter){ return filter.filter(function(c){ return it.all.indexOf(c) > -1; }); }
function soldList(){ try { return JSON.parse(localStorage.getItem("dd-sold") || "[]"); } catch(e){ return []; } }
function isSold(it){ var s = soldList(); return it.menu ? (s.indexOf(it.menu.main) > -1 || s.indexOf(it.menu.pommes) > -1 || s.indexOf(it.menu.drink) > -1) : s.indexOf(it.id) > -1; }
/* Upsell: höchstens 3 Vorschläge, nie etwas, das schon im Warenkorb liegt */
function upsell(){
  var out = [], c = S.cart, has = function(f){ return c.some(function(l){ return f(I[l.id], l); }); };
  var MENU_OF = {}; M.items.forEach(function(i){ if(i.menu) MENU_OF[i.menu.main] = i; });
  var loose = c.filter(function(l){ return MENU_OF[l.id]; })[0];
  if(loose){ var mn = MENU_OF[loose.id]; out.push({why: "Mach ein Menü daraus", kind: "menu", item: mn, line: loose, delta: mn.price - lineUnit(loose)}); }
  var hasDrink = has(function(i){ return i.kat === "Getränke" || i.menu; });
  if(!hasDrink) out.push({why: "Was zu trinken dazu?", kind: "item", ids: ["cola", "hausgemachte-limo", "ayran", "wasser"]});
  var hasFries = has(function(i){ return i.kat === "Pommes" || i.menu || i.id === "don-box" || i.id === "chicken-box" || i.id === "kinderteller"; });
  if(!hasFries && has(function(i){ return ["Döner", "Burger", "Chicken"].indexOf(i.kat) > -1 && !i.menu; })) out.push({why: "Pommes dazu?", kind: "item", ids: ["pommes", "cheese-pommes", "suesskartoffel-pommes"]});
  var hasSauce = has(function(i){ return i.kat === "Soßen"; });
  if(!hasSauce && has(function(i){ return ["Döner", "Burger", "Chicken"].indexOf(i.kat) > -1; })) out.push({why: "Noch eine Soße?", kind: "item", ids: ["knoblauchsosse", "don-sosse", "scharfe-sosse"]});
  if(!has(function(i){ return i.kat === "Süßes"; })) out.push({why: "Zum Abschluss", kind: "item", ids: ["baklava", "cay"]});
  return out.slice(0, 3);
}

/* ---------------- API (Demo: localStorage; Betrieb: Server) ---------------- */
var bc = ("BroadcastChannel" in window) ? new BroadcastChannel("dondoener") : null;
function db(){ try { return JSON.parse(localStorage.getItem("dd-orders") || "[]"); } catch(e){ return []; } }
function save(o){ try { localStorage.setItem("dd-orders", JSON.stringify(o)); } catch(e){} if(bc) bc.postMessage("orders"); }
function setSold(a){ try { localStorage.setItem("dd-sold", JSON.stringify(a)); } catch(e){} if(bc) bc.postMessage("sold"); }
function nextNumber(){
  var d = new Date().toISOString().slice(0, 10), st; try { st = JSON.parse(localStorage.getItem("dd-seq") || "{}"); } catch(e){ st = {}; }
  if(st.d !== d) st = {d: d, n: R.order_start - 1};
  st.n++; try { localStorage.setItem("dd-seq", JSON.stringify(st)); } catch(e){}
  return R.order_prefix + st.n;
}
function lineOpts(l){
  var it = I[l.id], o = [];
  if(it.brot || it.dueruem) o.push(it.dueruem ? "Dürüm" : BROT_TXT[l.brot]);
  if(it.protein) o.push(l.protein);
  var ss = Object.keys(l.sosse).filter(function(k){ return l.sosse[k]; }).map(function(k){ return (l.sosse[k] > 1 ? l.sosse[k] + "× " : "") + I[k].name; });
  if(ss.length) o.push("Soße: " + ss.join(", "));
  if(l.ohne.length) o.push("OHNE " + l.ohne.join(", "));
  if(it.menu) o.push("inkl. " + I[it.menu.pommes].name + " und " + I[it.menu.drink].name);
  return o;
}
function buildOrder(method){
  var tt = totals(), now = new Date().toISOString(), paid = method === "card";
  return {id: "o" + Date.now() + Math.floor(Math.random() * 100), number: nextNumber(), created: now, mode: S.mode, totals: tt,
    lines: S.cart.map(function(l){ var it = I[l.id]; return {id: l.id, name: it.name, qty: l.qty, station: it.station, opts: lineOpts(l), total: lineTotal(l)}; }),
    pay: {method: method, status: paid ? "paid" : "open"}, status: paid ? "new" : "awaiting_payment", log: [{s: paid ? "new" : "awaiting_payment", at: now}]};
}
function placeOrder(method){ var o = buildOrder(method), all = db(); all.push(o); save(all); return o; }

/* ---------------- Aktionen ---------------- */
function reset(){ S.screen = "attract"; S.mode = null; S.cart = []; S.sheet = null; S.dlg = null; S.cat = "Menüs"; S.upDone = false; S.last = null; S.toast = null; clearTimeout(doneTimer); render(); }
function complete(method){ S.last = placeOrder(method); S.screen = "done"; S.cart = []; S.sheet = null; render(); clearTimeout(doneTimer); doneTimer = setTimeout(function(){ if(S.screen === "done") reset(); }, 20000); }
function act(a, v){
  lastTouch = Date.now();
  var l = S.sheet && S.sheet.line;
  switch(a){
    case "start": S.screen = "mode"; break;
    case "mode": S.mode = v; S.screen = "menu"; break;
    case "cat": S.cat = v; break;
    case "card": var it = I[v]; if(isSold(it)) return;
      if(needsSheet(it)){ S.sheet = {line: newLine(it)}; } else { addLine(newLine(it)); toast(it.name + " liegt im Warenkorb"); return; } break;
    case "sheetx": S.sheet = null; break;
    case "brot": l.brot = v; break;
    case "prot": l.protein = v; break;
    case "s+": l.sosse[v] = (l.sosse[v] || 0) + 1; break;
    case "s-": l.sosse[v] = Math.max(0, (l.sosse[v] || 0) - 1); if(!l.sosse[v]) delete l.sosse[v]; break;
    case "ohne": var ix = l.ohne.indexOf(v); if(ix > -1) l.ohne.splice(ix, 1); else l.ohne.push(v); break;
    case "q+": l.qty = Math.min(R.max_qty, l.qty + 1); break;
    case "q-": l.qty = Math.max(1, l.qty - 1); break;
    case "addline": if(!lineComplete(l)) return; var nm = I[l.id].name; addLine(l); S.sheet = null; toast(nm + " liegt im Warenkorb"); return;
    case "checkout": if(!S.cart.length) return; if(!S.upDone && upsell().length){ S.screen = "upsell"; } else S.screen = "cart"; break;
    case "u-add": addLine(newLine(I[v])); toast(I[v].name + " liegt im Warenkorb"); S.upDone = false; if(!upsell().length) S.screen = "cart"; else S.upDone = false; break;
    case "u-menu": var m = I[v], lo = S.cart.filter(function(x){ return x.id === m.menu.main; })[0];
      if(lo){ var nl = {id: m.id, qty: 1, brot: lo.brot, sosse: JSON.parse(JSON.stringify(lo.sosse)), ohne: lo.ohne.slice(), protein: lo.protein}; lo.qty--; if(lo.qty <= 0) S.cart.splice(S.cart.indexOf(lo), 1); addLine(nl); }
      S.upDone = false; if(!upsell().length) S.screen = "cart"; break;
    case "skip": S.upDone = true; S.screen = "cart"; break;
    case "more": S.screen = "menu"; break;
    case "c+": S.cart.forEach(function(x){ if(x.uid == v) x.qty = Math.min(R.max_qty, x.qty + 1); }); break;
    case "c-": S.cart.forEach(function(x){ if(x.uid == v) x.qty = Math.max(1, x.qty - 1); }); break;
    case "c-rm": S.cart = S.cart.filter(function(x){ return x.uid != v; }); if(!S.cart.length) S.screen = "menu"; break;
    case "topay": S.screen = "pay"; break;
    case "back-cart": S.screen = "cart"; break;
    case "failtoggle": S.payfail = !S.payfail; break;
    case "pm":
      if(v === "cash"){ complete("cash"); return; }
      S.screen = "paying"; render(); setTimeout(function(){ if(S.screen !== "paying") return; if(S.payfail){ S.screen = "payfail"; render(); } else complete("card"); }, 2600); return;
    case "newo": reset(); return;
    case "filter": S.dlg = "filter"; break;
    case "ftog": var fi = S.filter.indexOf(v); if(fi > -1) S.filter.splice(fi, 1); else S.filter.push(v); break;
    case "fclear": S.filter = []; break;
    case "access": S.access = !S.access; break;
    case "cancel": S.dlg = "cancel"; break;
    case "dlgx": S.dlg = null; break;
    case "reset": reset(); return;
  }
  render();
}

  if(t.tagName === "LABEL") return; if(t.classList.contains("scrim") && S.dlg === "idle") return;

/* Leerlauf: nach 60 s Frage, nach 15 s weiteren Sekunden zurück zum Start */
if(VIEW === "kiosk") setInterval(function(){
  if(S.screen === "attract" || S.screen === "done" || S.screen === "paying") return;

  var late = (o.status === "new" || o.status === "prep") && mins(o) >= 8;
  var lines = o.lines.map(function(l){ return '<div class="l"><b>' + l.qty + "× " + esc(l.name) + "</b><em>" + esc(l.station) + "</em>" + (l.opts.length ? "<i>" + l.opts.map(function(x){ return x.indexOf("OHNE") === 0 ? '<span class="ox">' + esc(x) + "</span>" : esc(x); }).join(" · ") + "</i>" : "") + "</div>"; }).join("");
  return '<div class="tk' + (late ? " late" : "") + '"><div class="h"><b>' + o.number + "</b><span>" + mins(o) + " min</span></div><div class=\"m\">" + (o.mode === "go" ? "Mitnehmen" : "Hier essen") + " · " + eur(o.totals.gross) + " · " + (o.pay.method === "card" ? "Karte" : "Bar") + "</div>" + lines + (btn ? '<button data-k="' + btn[0] + '" data-id="' + o.id + '">' + btn[1] + "</button>" : "") + "</div>";
}
function renderKds(){
  var all = db(), col = function(st, title, btn){ var os = all.filter(function(o){ return o.status === st; }); return '<div class="k-col"><h2><span>' + title + "</span><span>" + os.length + "</span></h2>" + os.map(function(o){ return ticket(o, btn); }).join("") + "</div>"; };
  var sold = soldList();
  var drawer = K_OPEN ? '<div class="k-draw"><h3>Ausverkauft schalten</h3>' + M.items.filter(function(i){ return !i.menu; }).map(function(i){ var s = sold.indexOf(i.id) > -1; return '<div class="it"><span>' + esc(i.name) + '</span><button class="' + (s ? "on" : "") + '" data-sold="' + i.id + '">' + (s ? "Ausverkauft" : "Verfügbar") + "</button></div>"; }).join("") + "</div>" : "";
  app.innerHTML = '<div class="k-wrap"><div class="k-top">' + logo("lgw") + "<h1>Küche</h1><button class=\"k-btn\" data-drawer=\"1\">Ausverkauft (" + sold.length + ")</button></div><div class=\"k-cols\">" +
    col("awaiting_payment", "Zahlung offen", ["new", "Bezahlt markieren"]) + col("new", "Neu", ["prep", "In Arbeit"]) + col("prep", "In Arbeit", ["ready", "Fertig, Nummer rufen"]) + col("ready", "Fertig", ["done", "Abgeholt"]) + "</div>" + drawer + "</div>";
}
function renderReady(){
  var all = db(), f = all.filter(function(o){ return o.status === "ready"; }), p = all.filter(function(o){ return o.status === "prep" || o.status === "new"; });
  app.innerHTML = '<div class="r-wrap"><section class="r-a"><h1>Fertig</h1><div class="nums">' + (f.length ? f.map(function(o){ return "<span>" + o.number + "</span>"; }).join("") : '<div class="empty">Gerade ist nichts fertig. Der Spieß dreht sich.</div>') + "</div></section>" +
    '<section class="r-b"><h1>In Arbeit</h1><div class="nums">' + (p.length ? p.map(function(o){ return "<span>" + o.number + "</span>"; }).join("") : '<div class="empty">Keine offenen Bestellungen.</div>') + '</div><div class="r-top">' + logo("lgw") + "</div></section></div>";
}
if(VIEW !== "kiosk"){
  app.addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    if(b.dataset.k){ advance(b.dataset.id, b.dataset.k); render(); }
    else if(b.dataset.drawer){ K_OPEN = !K_OPEN; render(); }
    else if(b.dataset.sold){ var s = soldList(), i = s.indexOf(b.dataset.sold); if(i > -1) s.splice(i, 1); else s.push(b.dataset.sold); setSold(s); render(); }
  });
  if(bc) bc.onmessage = function(){ render(); };
  addEventListener("storage", render); setInterval(render, 15000);
} else if(bc) bc.onmessage = function(m){ if(m.data === "sold") render(); };
render();
})();

</script>
</body>
</html>
